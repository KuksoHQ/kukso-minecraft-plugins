name: Release

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to release
        required: true
        type: choice
        options:
          - lib
          - dialogs
          - dialogs-exp-config-addon
          - worlds
          - items
      version:
        description: Version from modules/<module>/version.txt
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail

          module="${{ inputs.module }}"
          version="${{ inputs.version }}"

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Run releases from main, not ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          case "$module" in
            lib|dialogs|dialogs-exp-config-addon|worlds|items) ;;
            *) echo "Unsupported module: $module" >&2; exit 1 ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Version must be SemVer: X.Y.Z, X.Y.Z-alpha.N, X.Y.Z-beta.N, or X.Y.Z-rc.N" >&2
            exit 1
          fi

          version_file="modules/$module/version.txt"
          if [[ ! -f "$version_file" ]]; then
            echo "Missing $version_file" >&2
            exit 1
          fi

          file_version="$(tr -d '[:space:]' < "$version_file")"
          if [[ "$file_version" != "$version" ]]; then
            echo "$version_file contains '$file_version', expected '$version'" >&2
            exit 1
          fi

          tag="kukso-minecraft-$module-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build selected module
        run: ./gradlew :${{ steps.release.outputs.module }}:build

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          files: modules/${{ steps.release.outputs.module }}/build/libs/Kukso*-Paper-${{ steps.release.outputs.version }}.jar

      - name: Generate KuksoLib JavaDocs
        if: steps.release.outputs.module == 'lib'
        run: ./gradlew :lib:javadoc

      - name: Checkout website pages
        if: steps.release.outputs.module == 'lib'
        uses: actions/checkout@v4
        with:
          repository: KuksoHQ/kuksohq.github.io
          ref: gh-pages
          path: website-pages
          token: ${{ secrets.GH_PAT_PAGES }}

      - name: Publish KuksoLib JavaDocs
        if: steps.release.outputs.module == 'lib'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          target="website-pages/api/minecraft/lib"
          rm -rf "$target/v$version" "$target/latest"
          mkdir -p "$target/v$version" "$target/latest"
          cp -R modules/lib/build/docs/javadoc/. "$target/v$version/"
          cp -R modules/lib/build/docs/javadoc/. "$target/latest/"
          cd website-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/minecraft/lib
          git commit -m "Publish Minecraft KuksoLib JavaDocs v$version" || exit 0
          git push

      - name: Publish KuksoLib Maven artifact
        if: steps.release.outputs.module == 'lib' && vars.ENABLE_MAVEN_PUBLISH == 'true'
        run: ./gradlew :lib:publish
        env:
          KUKSO_USER: ${{ secrets.KUKSO_USER }}
          KUKSO_TOKEN: ${{ secrets.KUKSO_TOKEN }}
