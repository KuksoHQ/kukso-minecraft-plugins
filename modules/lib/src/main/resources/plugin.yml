name: CublexCore
main: io.github.cublexlabs.cublexcore.Main
version: ${version}
api-version: '1.21'
load: STARTUP
authors: [ DevBD1 ]
description: Spigot development library, built for the latest version. It is a dependency for my Minecraft plugins.
website: https://labs.cublex.net
depend:
  - ProtocolLib
softdepend:
  - CubItems
  - CubLoots
  - CubSense
  - CubConquest
  - RealisticSeasons
  - PlaceholderAPI
commands:
  cublex:
    description: CublexCore main command
    usage: /cublex <help|ver|reload|getKey|testLogger>
    permission: cublexcore.admin

permissions:
  cublexcore.admin:
    description: Allows high-level admin access to any command
    default: op
  cublexcore.mod:
    description: Allows low-level access to some admin commands
  cublexcore.user:
    description: Allows access to user commands
  cublexcore.cmd.testlogger:
    description: Allows access to /cublex testlogger command
    default: op