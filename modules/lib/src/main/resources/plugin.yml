name: KuksoLib
main: com.kukso.minecraft.lib.Main
version: ${version}
api-version: '1.21'
load: STARTUP
authors: [ DevBD1 ]
description: Spigot development library, built for the latest version. It is a dependency for my Minecraft plugins.
website: https://kukso.com
depend:
  - ProtocolLib
softdepend:
  - KuksoItems
  - RealisticSeasons
  - PlaceholderAPI
# You can manage each subcommand in config.yml
commands:
  kukso:
    usage: /kukso <help|ver|reload|getKey|testLogger>
    permission: kuksolib.admin
    description: KuksoLib main command
# Permissions are dynamically set for each command in config.yml
permissions:
  kuksolib.admin:
    description: Allows high-level admin access to any command
    default: op
  kuksolib.mod:
    description: Allows low-level access to some admin commands
  kuksolib.user:
    description: Allows access to user commands
  kuksolib.command.root:
    description: Use it with specific perm(s) of a subcommand
  kuksolib.cmd.testlogger:
    description: Allows access to /kukso testlogger command